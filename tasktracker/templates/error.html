{% extends 'base.html' %}

{% block title %}{{ error.code }} {{ error.name }}{% endblock %}

{% block content %}
  <div class="text-center py-5">
    <p class="display-1 fw-bold text-primary mb-0">{{ error.code }}</p>
    <h1 class="h3 mb-3">{{ error.name }}</h1>
    <p class="text-body-secondary mb-4">{{ error.description }}</p>
    <div class="d-flex flex-wrap justify-content-center gap-2">
      <a class="btn btn-primary" href="{{ url_for('home') }}">Go to the home page</a>
      {% if g.user %}
        <a class="btn btn-outline-primary" href="{{ url_for('tasks.dashboard') }}">Back to your dashboard</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
